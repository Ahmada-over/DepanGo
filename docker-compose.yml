version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mirahtec
      POSTGRES_PASSWORD: Msasu2025@.
      POSTGRES_DB: techconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirahtec -d techconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mirahtec:Msasu2025@.@db:5432/techconnect
      - ENVIRONMENT=development
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy

  web_landing:
    build:
      context: ./web_landing
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
