name: techconnect_mobile
description: "TechConnect Mobile Client App in Flutter for client service booking and tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  intl: ^0.19.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  audioplayers: ^6.1.0
  google_maps_flutter: ^2.14.2
  flutter_polyline_points: ^3.1.0
  geocoding: ^4.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2

dev_dependencies:
  intl: ^0.19.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
