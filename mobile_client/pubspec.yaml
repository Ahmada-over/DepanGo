name: techconnect_mobile
description: "TechConnect Mobile Client App in Flutter for client service booking and tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  intl: ^0.19.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.3
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  audioplayers: ^6.1.0
  google_maps_flutter: ^2.14.2
  flutter_polyline_points: ^3.1.0
  geocoding: ^4.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  connectivity_plus: ^7.3.1
  flutter_lucide: ^1.33.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  pinput: ^6.0.2
  intl_phone_number_input: ^0.7.5
  flutter_local_notifications: ^22.3.0
dev_dependencies:
  intl: ^0.19.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

